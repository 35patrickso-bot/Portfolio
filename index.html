<!doctype html>
<html lang="en" class="bg-[#f4f4f1] dark:bg-[#121212] text-black dark:text-gray-200 antialiased selection:bg-black selection:text-white dark:selection:bg-white dark:selection:text-black">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Patrick Nicos So — Portfolio</title>
    <meta name="description" content="Tech-Savvy Executive Assistant & Operations Specialist portfolio of Patrick Nicos So." />
    <meta property="og:title" content="Patrick Nicos So — Portfolio" />
    <meta property="og:description" content="Tech-Savvy Executive Assistant & Operations Specialist portfolio of Patrick Nicos So." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      (function() {
        var theme = localStorage.getItem('theme');
        if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>
  </head>
  <body class="bg-[#f4f4f1] dark:bg-[#121212] text-black dark:text-gray-200 min-h-screen transition-colors duration-500 ease-in-out">
    <!-- Loading Screen Overlay -->
    <div id="loader-wrapper">
      <div class="loader"></div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <script>
      (function() {
        function removeLoader() {
          var loader = document.getElementById('loader-wrapper');
          if (!loader) return;
          // Smooth fade out
          setTimeout(function() {
            loader.style.opacity = '0';
            setTimeout(function() {
              if (loader.parentNode) {
                loader.parentNode.removeChild(loader);
              }
            }, 600);
          }, 400);
        }

        if (document.readyState === 'complete') {
          removeLoader();
        } else {
          window.addEventListener('load', removeLoader);
        }
      })();
    </script>
  </body>
</html>
